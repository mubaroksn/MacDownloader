name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.0" >> "$GITHUB_ENV"
          fi
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build app and DMG
        run: |
          swift --version
          chmod +x scripts/build_app.sh
          set +e
          scripts/build_app.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as one annotation (readable via the checks API).
            msg=$( (grep -E "error:|Error|failed" build.log || tail -n 40 build.log) | sort -u | head -n 60 \
              | sed -e 's/%/%25/g' -e "s|$GITHUB_WORKSPACE/||g" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
          fi
          exit "$status"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MacDownloader-${{ env.VERSION }}-build${{ env.BUILD }}
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
