name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Versi rilis (mis. 1.0.0). Kosongkan untuk build biasa."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ -n "${{ github.event.inputs.release }}" ]]; then
            echo "VERSION=${{ github.event.inputs.release }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.0" >> "$GITHUB_ENV"
          fi
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Translations (every text has English, formats match, generated code current)
        run: |
          if ! python3 scripts/l10n.py --check > l10n.log; then
            msg=$(grep -v '^l10n:' l10n.log | head -n 60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Translations::$msg"
            cat l10n.log
            exit 1
          fi
          echo "::notice title=Translations::$(tail -n 1 l10n.log)"

      - name: Unit & integration tests (DownloadCore)
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "Executed [0-9]+ tests" test.log | tail -n 1)
          [ -n "$summary" ] && echo "::notice title=Tests::$summary"
          if [ "$status" -ne 0 ]; then
            msg=$( (grep -E "error:|failed|Fatal|crash" test.log || tail -n 60 test.log) | sort -u | head -n 80 \
              | sed -e 's/%/%25/g' -e "s|$GITHUB_WORKSPACE/||g" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests failed::$msg"
          fi
          exit "$status"

      - name: Build app and DMG
        run: |
          swift --version
          chmod +x scripts/build_app.sh
          set +e
          scripts/build_app.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as one annotation (readable via the checks API).
            msg=$( (grep -E "error:|Error|failed" build.log || tail -n 40 build.log) | sort -u | head -n 60 \
              | sed -e 's/%/%25/g' -e "s|$GITHUB_WORKSPACE/||g" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
          fi
          exit "$status"

      - name: Firefox extension (lint + sign)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          RELEASE: ${{ github.event.inputs.release }}
        shell: bash {0}
        run: |
          SRC=dist/ext/FirefoxExtension
          npx -y web-ext@8 lint --source-dir "$SRC" --output json > lint.json 2>/dev/null
          python3 - <<'PY'
          import json
          r = json.load(open("lint.json"))
          s = r["summary"]
          print(f"::notice title=Firefox lint::errors={s['errors']} warnings={s['warnings']} notices={s['notices']}")
          for e in r.get("errors", []):
              print(f"::error title=Firefox lint::{e['code']}: {e['message']} ({e.get('file','')})")
          for w in r.get("warnings", []):
              print(f"::warning title=Firefox lint::{w['code']}: {w['message']} ({w.get('file','')})")
          raise SystemExit(1 if s["errors"] else 0)
          PY
          [ $? -eq 0 ] || exit 1

          # Signing makes the add-on installable for good in normal Firefox. It needs free
          # addons.mozilla.org API keys as repo secrets; without them the release ships the zip only.
          if [[ -z "$RELEASE" ]]; then echo "::notice title=Firefox sign::skipped (not a release build)"; exit 0; fi
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then
            echo "::warning title=Firefox sign::AMO_JWT_ISSUER/AMO_JWT_SECRET not set — release has the unsigned zip only"
            exit 0
          fi
          mkdir -p signed
          npx -y web-ext@8 sign --channel unlisted --source-dir "$SRC" --artifacts-dir signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --approval-timeout 900000 2>&1 | tail -n 15 > sign.log
          xpi=$(ls signed/*.xpi 2>/dev/null | head -n 1)
          if [[ -n "$xpi" ]]; then
            cp "$xpi" "dist/wwwrap-Firefox-$VERSION.xpi"
            echo "::notice title=Firefox sign::signed $(basename "$xpi")"
          else
            msg=$(sed -e 's/%/%25/g' sign.log | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Firefox sign failed::$msg"
          fi

      - name: Installer script (latest release, then this build over it)
        run: |
          fail() { echo "::error title=install.sh::$1"; exit 1; }
          DEST="$RUNNER_TEMP/apps"
          export WWWRAP_REPO="${{ github.repository }}" WWWRAP_DEST="$DEST" WWWRAP_NO_OPEN=1

          # 1. Latest published release (before 1.7.0 it is still called MacDownloader).
          bash install.sh > install-latest.log 2>&1 \
            || fail "install of the latest GitHub release failed: $(tail -n 5 install-latest.log | tr '\n' ' ')"
          latest=$(sed -n 's/^INSTALLED_APP=//p' install-latest.log)
          v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$latest/Contents/Info.plist")
          echo "::notice title=install.sh::latest release installed: $(basename "$latest") v$v"

          # 2. This build on top: replaces the app and retires a MacDownloader.app left from step 1.
          WWWRAP_DMG="$(ls dist/*.dmg | head -n 1)" bash install.sh > install-local.log 2>&1 \
            || fail "install from local DMG failed: $(tail -n 5 install-local.log | tr '\n' ' ')"
          [ -x "$DEST/wwwrap.app/Contents/MacOS/wwwrap" ] || fail "wwwrap.app missing after install"
          [ -e "$DEST/MacDownloader.app" ] && fail "old MacDownloader.app was not removed"
          xattr -p com.apple.quarantine "$DEST/wwwrap.app" >/dev/null 2>&1 && fail "app still has the quarantine flag"
          codesign -dv "$DEST/wwwrap.app" 2>&1 | grep -q "Signature=adhoc" || fail "app is not ad-hoc signed"
          echo "::notice title=install.sh::this build installed over it, ad-hoc signed, no quarantine flag, old app retired"

      - name: Migration from MacDownloader (settings + download list)
        run: |
          fail() { echo "::error title=Migration::$1"; pkill -x wwwrap || true; exit 1; }
          OLD="$HOME/Library/Application Support/MacDownloader"
          mkdir -p "$OLD"
          printf '%s' '[{"id":"5F1B1A9E-3C7B-4D8E-9A51-2B6C7D8E9F01","url":"https://example.com/lama.zip","fileName":"lama.zip","category":"archive","status":"completed","totalBytes":10,"downloadedBytes":10,"supportsRanges":false,"segments":[],"addedAt":0,"headers":{}}]' > "$OLD/downloads.json"
          defaults write com.mubaroksn.macdownloader connectionsPerDownload -int 12
          "dist/wwwrap.app/Contents/MacOS/wwwrap" -appLanguage id > app-migrate.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -H "X-MacDL-Client: ci" http://127.0.0.1:9614/ping | grep -q '"ok":true' && break
            sleep 1
          done
          sleep 2
          pkill -x wwwrap || true
          sleep 2
          [ "$(defaults read com.mubaroksn.wwwrap connectionsPerDownload 2>/dev/null)" = "12" ] || fail "settings were not migrated"
          grep -q "lama.zip" "$HOME/Library/Application Support/wwwrap/downloads.json" || fail "download list was not migrated"
          [ -f "$OLD/downloads.json" ] || fail "old folder should be left in place (unpacked extensions load from it)"
          defaults delete com.mubaroksn.wwwrap connectionsPerDownload
          echo "::notice title=Migration::MacDownloader settings and download list carried over to wwwrap"

      - name: In-app update (an older copy updates itself from this DMG)
        run: |
          fail() { echo "::error title=In-app update::$1"; pkill -x wwwrap || true; exit 1; }
          DIR="$RUNNER_TEMP/upd"
          rm -rf "$DIR"; mkdir -p "$DIR"
          ditto dist/wwwrap.app "$DIR/wwwrap.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.0.1" "$DIR/wwwrap.app/Contents/Info.plist"
          codesign --force --deep --sign - "$DIR/wwwrap.app"
          DMG="$PWD/$(ls dist/*.dmg | head -n 1)"
          "$DIR/wwwrap.app/Contents/MacOS/wwwrap" -appLanguage id -updateTestDMG "$DMG" > app-update.log 2>&1 &
          v=""
          for i in $(seq 1 90); do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$DIR/wwwrap.app/Contents/Info.plist" 2>/dev/null || true)
            [ "$v" = "$VERSION" ] && break
            sleep 1
          done
          [ "$v" = "$VERSION" ] || fail "app was not replaced (still ${v:-missing}): $(tail -n 15 app-update.log | tr '\n' ' ')"
          codesign --verify --deep --strict "$DIR/wwwrap.app" || fail "updated app fails the signature check"
          for i in $(seq 1 20); do pgrep -f "$DIR/wwwrap.app/Contents/MacOS/wwwrap" >/dev/null && break; sleep 1; done
          pgrep -f "$DIR/wwwrap.app/Contents/MacOS/wwwrap" >/dev/null || fail "updated app did not relaunch"
          leftovers=$(ls -A "$DIR" | grep -v '^wwwrap.app$' || true)
          [ -z "$leftovers" ] || fail "leftover files after the update: $leftovers"
          echo "::notice title=In-app update::0.0.1 -> $VERSION: downloaded, verified, swapped and relaunched"
          pkill -x wwwrap || true
          sleep 2

      - name: Smoke test (launch app + real multi-connection download)
        run: |
          set -u
          fail() { echo "::error title=Smoke test failed::$1"; pkill -x wwwrap || true; exit 1; }
          note() { echo "::notice title=Smoke test::$1"; echo "$1"; }

          # Pinned to Indonesian: the checks below expect the Indonesian folder names (Downloads/Lainnya).
          "dist/wwwrap.app/Contents/MacOS/wwwrap" -appLanguage id > app.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -H "X-MacDL-Client: ci" http://127.0.0.1:9614/ping | grep -q '"ok":true' && break
            sleep 1
          done
          pgrep -x wwwrap >/dev/null || fail "app exited on launch: $(tail -n 20 app.log | tr '\n' ' ')"
          curl -s -H "X-MacDL-Client: ci" http://127.0.0.1:9614/ping | grep -q '"ok":true' || fail "local server not answering"
          note "app launched, local server answers /ping"

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9614/ping)
          [ "$code" = "403" ] || fail "request without client header should be 403, got $code"
          note "requests without the extension header are rejected (403)"

          URL="https://proof.ovh.net/files/10Mb.dat"
          curl -sL -o reference.dat "$URL" || fail "could not fetch reference file"
          curl -s -X POST -H "X-MacDL-Client: ci" -H "Content-Type: application/json" \
            -d "{\"url\":\"$URL\"}" http://127.0.0.1:9614/add | grep -q '"ok":true' || fail "/add rejected"

          OUT="$HOME/Downloads/Lainnya/10Mb.dat"
          for i in $(seq 1 120); do [ -f "$OUT" ] && break; sleep 1; done
          [ -f "$OUT" ] || fail "download did not finish in 120s. state: $(cat "$HOME/Library/Application Support/wwwrap/downloads.json" 2>/dev/null | head -c 600)"
          cmp -s "$OUT" reference.dat || fail "downloaded file differs from reference ($(stat -f%z "$OUT") vs $(stat -f%z reference.dat) bytes)"
          note "downloaded 10 MB via app into Downloads/Lainnya, byte-identical to curl copy (took ~${i}s)"

          # Browser hand-off: the app must refuse links it cannot fetch (so the browser keeps them)…
          r=$(curl -s -X POST -H "X-MacDL-Client: ci" -H "Content-Type: application/json" \
            -d '{"url":"https://github.com/${{ github.repository }}/raw/main/does-not-exist.bin","handoff":true}' http://127.0.0.1:9614/add)
          echo "$r" | grep -q '"accepted":false' || fail "hand-off of a 404 link should be refused, got: $r"
          # …and accept share links it can resolve (GitHub blob page -> raw file).
          r=$(curl -s -X POST -H "X-MacDL-Client: ci" -H "Content-Type: application/json" \
            -d '{"url":"https://github.com/${{ github.repository }}/blob/main/Package.swift","handoff":true}' http://127.0.0.1:9614/add)
          echo "$r" | grep -q '"accepted":true' || fail "hand-off of a GitHub blob link should be accepted, got: $r"
          OUT2="$HOME/Downloads/Lainnya/Package.swift"
          for i in $(seq 1 60); do [ -f "$OUT2" ] && break; sleep 1; done
          [ -f "$OUT2" ] && head -n 1 "$OUT2" | grep -q "swift-tools-version" || fail "GitHub blob link did not resolve to the raw file"
          note "hand-off: refused a 404 link, resolved a GitHub blob link to the raw file"
          # Public Google Drive folder link -> every file, folder structure kept.
          curl -s -X POST -H "X-MacDL-Client: ci" -H "Content-Type: application/json" \
            -d '{"url":"https://drive.google.com/drive/folders/1Gz05BcrlN_Trf4F_Zf-F6YrG3sQa5O7V?usp=sharing"}' http://127.0.0.1:9614/add >/dev/null
          for i in $(seq 1 150); do
            n=$(find "$HOME/Downloads" -mindepth 2 -maxdepth 2 -path "*Alta Vista*" -type f ! -name "*.mdownload" 2>/dev/null | wc -l | tr -d ' ')
            [ "$n" -ge 10 ] && break; sleep 1
          done
          if [ "${n:-0}" -ge 10 ]; then
            note "Google Drive folder: $n files downloaded into $(find "$HOME/Downloads" -maxdepth 1 -name '*Alta Vista*' | head -1)"
          else
            echo "::warning title=Drive folder::only ${n:-0} files after 150s (Google may rate-limit CI runners); state: $(python3 -c "import json,os; d=json.load(open(os.path.expanduser('~/Library/Application Support/wwwrap/downloads.json'))); print([ (i['fileName'], i['status'], i.get('errorMessage')) for i in d][:6])")"
          fi
          r=$(curl -s -X POST -H "X-MacDL-Client: ci" -H "Content-Type: application/json" -d '{"browser":"CI"}' http://127.0.0.1:9614/hello)
          echo "$r" | grep -q '"ok":true' || fail "/hello heartbeat failed: $r"

          pgrep -x wwwrap >/dev/null || fail "app crashed during download"
          pkill -x wwwrap || true

      - name: UI screenshots (light + dark)
        continue-on-error: true
        run: |
          APP="dist/wwwrap.app/Contents/MacOS/wwwrap"
          SHOTS="$RUNNER_TEMP/shots"; mkdir -p "$SHOTS"
          add() { curl -s -X POST -H "X-MacDL-Client: ci" -H "Content-Type: application/json" \
                    -d "{\"url\":\"$1\",\"filename\":\"$2\"}" http://127.0.0.1:9614/add >/dev/null; }
          waitping() { for i in $(seq 1 20); do curl -s -H "X-MacDL-Client: ci" http://127.0.0.1:9614/ping | grep -q ok && return; sleep 1; done; }
          F=https://proof.ovh.net/files

          "$APP" -appLanguage id -appearance light -snapshotPath "$SHOTS/light.png" -snapshotMenuBarPath "$SHOTS/menubar.png" -snapshotDelay 28 > app-light.log 2>&1 &
          waitping
          add "$F/100Mb.dat" "Laporan-Keuangan-Q3.pdf"
          add "$F/1Mb.dat" "Foto-Prewedding.jpg"
          add "$F/1Mb.dat" "Podcast-Episode-12.mp3"
          osascript -e 'tell application "Finder" to activate' >/dev/null 2>&1 || true
          sleep 1
          printf '%s' "https://github.com/${{ github.repository }}/releases/download/v1.1.0/wwwrap-1.1.0.dmg" | pbcopy
          add "$F/does-not-exist.zip" "Arsip-Proyek.zip"
          sleep 10
          add "$F/10Gb.dat" "Film-Liburan-Bali-4K.mp4"
          add "$F/10Gb.dat" "Xcode-Installer.dmg"
          sleep 20
          python3 -c "import json,os; d=json.load(open(os.path.expanduser('~/Library/Application Support/wwwrap/downloads.json'))); print('::notice title=State::' + ' | '.join('%s %s %s/%s segs=%d err=%s' % (i['fileName'], i['status'], i['downloadedBytes'], i['totalBytes'], len(i['segments']), i.get('errorMessage')) for i in d))"
          pmset -g assertions | grep -i -A1 "wwwrap" | head -n 4 | tr '\n' ' ' | sed 's/^/::notice title=Power assertion::/' ; echo
          sleep 4
          pkill -x wwwrap || true
          sleep 3
          pmset -g assertions | grep -qi "wwwrap" && echo "::warning title=Power assertion::still held after quit" || echo "::notice title=Power assertion::released after quit"
          sleep 2

          "$APP" -appLanguage id -appearance dark -snapshotPath "$SHOTS/dark.png" -snapshotDelay 8 > app-dark.log 2>&1 &
          sleep 12
          pkill -x wwwrap || true
          sleep 2
          "$APP" -appLanguage id -appearance light -startPage browser -snapshotPath "$SHOTS/browser.png" -snapshotDelay 6 > app-browser.log 2>&1 &
          sleep 10
          pkill -x wwwrap || true
          for section in downloads general about; do
            "$APP" -appLanguage id -appearance light -startPage settings -settingsSection $section -snapshotPath "$SHOTS/settings-$section.png" -snapshotDelay 6 > app-settings.log 2>&1 &
            sleep 9
            pkill -x wwwrap || true
            sleep 1
          done
          "$APP" -appLanguage id -appearance dark -startPage settings -settingsSection downloads -snapshotPath "$SHOTS/settings-dark.png" -snapshotDelay 6 > app-settings.log 2>&1 &
          sleep 9
          pkill -x wwwrap || true
          sleep 1
          # English
          "$APP" -appLanguage en -appearance light -snapshotPath "$SHOTS/en-downloads.png" -snapshotMenuBarPath "$SHOTS/en-menubar.png" -snapshotDelay 8 > app-en.log 2>&1 &
          sleep 12
          pkill -x wwwrap || true
          sleep 1
          for section in appearance downloads; do
            "$APP" -appLanguage en -appearance light -startPage settings -settingsSection $section -snapshotPath "$SHOTS/en-settings-$section.png" -snapshotDelay 6 > app-en.log 2>&1 &
            sleep 9
            pkill -x wwwrap || true
            sleep 1
          done
          "$APP" -appLanguage en -appearance light -startPage browser -snapshotPath "$SHOTS/en-browser.png" -snapshotDelay 6 > app-en.log 2>&1 &
          sleep 9
          pkill -x wwwrap || true

          ls -la "$SHOTS"
          cat app-light.log app-dark.log | tail -n 20
          for f in "$SHOTS"/*.png; do echo "::notice title=Screenshot::$(basename "$f") $(sips -g pixelWidth -g pixelHeight "$f" | tail -n 2 | awk '{print $2}' | tr '\n' 'x')"; done

          cd "$SHOTS"
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "UI screenshots from run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: wwwrap-${{ env.VERSION }}-build${{ env.BUILD }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.xpi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: wwwrap ${{ env.VERSION }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.xpi
          generate_release_notes: true
          body: |
            ## Pasang
            Cara tercepat — buka Terminal, tempel, Enter:
            ```
            curl -fsSL https://raw.githubusercontent.com/mubaroksn/wwwrap/main/install.sh | bash
            ```
            Atau unduh `.dmg` di bawah, tarik ke Applications. Saat pertama dibuka macOS akan menolak (app belum dinotarisasi Apple):
            buka **System Settings → Privacy & Security** → **Open Anyway**.
            Sudah terpasang? Update cukup dari dalam app: banner di halaman Download, atau **Pengaturan › Tentang › Update sekarang**.
