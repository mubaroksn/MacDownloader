<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; width: 250px; margin: 0; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #999; }
    .dot.on { background: #34c759; }
    .dot.off { background: #ff3b30; }
    label { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    input[type=number] { width: 60px; }
    #grant { display: none; width: 100%; margin: 0 0 12px; padding: 6px; font: inherit; cursor: pointer; }
    p { color: GrayText; font-size: 11px; margin: 10px 0 0; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>wwwrap</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="text" data-i18n>Memeriksa aplikasi…</span></div>
  <button id="grant" data-i18n>Izinkan akses ke semua situs</button>
  <label><span data-i18n>Tangkap download otomatis</span> <input type="checkbox" id="enabled"></label>
  <label><span data-i18n>Abaikan file di bawah (MB)</span> <input type="number" id="minSize" min="0" step="1"></label>
  <p><span data-i18n>Klik kanan pada link →</span> <b data-i18n>Download dengan wwwrap</b> <span data-i18n>juga bisa. Kalau aplikasi tidak berjalan, download kembali ditangani browser.</span></p>
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
